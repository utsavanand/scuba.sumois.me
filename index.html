<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>scuba</title>
<style>
  html, body { margin: 0; height: 100%; background: #0d0d0f; color: #f2f2f2;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .feed {
    height: 100dvh;
    overflow-y: scroll;
    scroll-snap-type: y mandatory;
  }
  section {
    height: 100dvh;
    scroll-snap-align: start;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  video {
    height: 100%;
    max-width: 100vw;
    object-fit: contain;
  }
  .caption {
    position: absolute;
    left: 0; right: 0; bottom: 2.2rem;
    text-align: center;
    font-size: 1.05rem;
    color: #f2f2f2;
    text-shadow: 0 1px 8px rgba(0,0,0,0.8);
    pointer-events: none;
  }
  .top {
    position: fixed;
    top: 0; left: 0; right: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 1rem 1.2rem;
    z-index: 2;
    background: linear-gradient(rgba(13,13,15,0.7), transparent);
  }
  .top h1 { font-size: 1.2rem; margin: 0; letter-spacing: 0.02em; }
  .top a { color: #9a9aa2; text-decoration: none; font-size: 0.9rem; margin-right: 1rem; }
  .top a:hover { color: #f2f2f2; }
  .right { display: flex; align-items: center; }
  #music {
    background: rgba(23,23,26,0.8);
    color: #f2f2f2;
    border: 1px solid #3a3a40;
    border-radius: 999px;
    padding: 0.45rem 1rem;
    font-size: 0.9rem;
    cursor: pointer;
  }
  #music.on { border-color: #7fd4a8; color: #7fd4a8; }
  .hint {
    position: fixed;
    bottom: 0.6rem; left: 0; right: 0;
    text-align: center;
    color: #9a9aa2;
    font-size: 0.8rem;
    z-index: 2;
    animation: fade 2.4s ease-in-out infinite alternate;
    pointer-events: none;
  }
  @keyframes fade { from { opacity: 0.9; } to { opacity: 0.25; } }
</style>
</head>
<body>
<div class="top">
  <h1>scuba</h1>
  <div class="right">
    <a href="https://sumois.me/">sumois.me</a>
    <button id="music">&#9834; music</button>
  </div>
</div>
<div class="feed">
  <section>
    <video src="ear-scratches.mp4" poster="ear-scratches-poster.jpg" muted loop playsinline preload="metadata"></video>
    <p class="caption">Ear scratches, eyes closed.</p>
  </section>
  <section>
    <video src="walk.mp4" poster="walk-poster.jpg" muted loop playsinline preload="metadata"></video>
    <p class="caption">Out on patrol in the booties.</p>
  </section>
</div>
<p class="hint">scroll &darr;</p>
<script>
  const videos = document.querySelectorAll('video');
  const observer = new IntersectionObserver(entries => {
    for (const e of entries) {
      if (e.isIntersecting) e.target.play().catch(() => {});
      else e.target.pause();
    }
  }, { threshold: 0.6 });
  videos.forEach(v => observer.observe(v));

  // Music-box loop, synthesized on-device so there's no track file or license to carry.
  const btn = document.getElementById('music');
  let ctx = null, timer = null, step = 0, nextTime = 0;
  const C=523.25, D=587.33, E=659.25, G=784.0, A=880.0, hiC=1046.5, hiE=1318.5;
  const melody = [
    E, G, A, hiC, A, G, E, D,
    C, E, G, A, G, E, D, 0,
    E, G, A, hiC, hiE, hiC, A, G,
    A, G, E, D, C, D, C, 0
  ];
  const bass = [261.63, 196.0, 220.0, 196.0];
  const stepDur = 0.28;

  function pluck(freq, t, vol, decay) {
    const osc = ctx.createOscillator();
    const shimmer = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.value = freq;
    shimmer.type = 'sine';
    shimmer.frequency.value = freq * 2.001;
    const sg = ctx.createGain();
    sg.gain.value = 0.25;
    shimmer.connect(sg).connect(gain);
    osc.connect(gain);
    gain.connect(ctx.destination);
    gain.gain.setValueAtTime(0, t);
    gain.gain.linearRampToValueAtTime(vol, t + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + decay);
    osc.start(t); osc.stop(t + decay);
    shimmer.start(t); shimmer.stop(t + decay);
  }

  function schedule() {
    while (nextTime < ctx.currentTime + 0.4) {
      const note = melody[step % melody.length];
      if (note) pluck(note, nextTime, 0.16, 1.6);
      if (step % 8 === 0) pluck(bass[(step / 8) % 4 | 0], nextTime, 0.09, 2.2);
      nextTime += stepDur;
      step++;
    }
  }

  btn.addEventListener('click', () => {
    if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (timer) {
      clearInterval(timer); timer = null;
      ctx.suspend();
      btn.classList.remove('on');
    } else {
      ctx.resume();
      nextTime = Math.max(nextTime, ctx.currentTime + 0.05);
      schedule();
      timer = setInterval(schedule, 150);
      btn.classList.add('on');
    }
  });
</script>
</body>
</html>
